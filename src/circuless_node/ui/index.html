<!doctype html>
<!-- Light mode pinned. The node admin UI is used beside the Cloud console and on
     projectors in review meetings; one appearance everywhere is worth more here than
     honouring a per-machine preference. tokens.css carries the dark values and the
     `data-theme` hook, so dropping this attribute is all it would take to allow both. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIRCULess Node</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="bar">
  <img class="bar__logo" src="assets/circuless-logo.svg" alt="CIRCULess">
  <span class="bar__node" id="node-name" hidden></span>
  <div class="bar__spacer"></div>
  <span class="bar__who" id="who" hidden></span>
  <button type="button" id="sign-out" class="button button--quiet" hidden>Sign out</button>
</header>

<main id="main">

  <!-- Nothing is known before config.json and the token exchange have resolved. Showing
       a signed-out state first would make a page reload flash "sign in" at someone who
       is signed in, which reads as having been logged out. -->
  <section class="panel" id="loading">
    <p class="muted">Starting…</p>
  </section>

  <section class="panel" id="signed-out" hidden>
    <h1>Node administration</h1>
    <p class="muted">Sign in with your CIRCULess account to manage this node's resources.</p>
    <button type="button" id="sign-in" class="button">Sign in</button>
  </section>

  <section id="signed-in" hidden>
    <h1>Your organisations on this node</h1>
    <p class="muted" id="tenants-intro"></p>
    <ul class="tenants" id="tenants"></ul>
  </section>

  <section class="panel panel--problem" id="problem" hidden>
    <h2 id="problem-title"></h2>
    <p id="problem-detail"></p>
    <p class="muted mono" id="problem-id" hidden></p>
    <button type="button" id="problem-retry" class="button button--quiet">Try again</button>
  </section>

</main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
