[project]
name = "circuless-node"
version = "0.4.0"
description = "CIRCULess Node — the data plane. Holds organisations' resources and decides every access locally."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

# Deliberately short. Every entry earns its place; token handling (pyjwt, cryptography),
# HTTP clients (httpx) and the admin UI (jinja) arrive with the components that need them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "fsspec>=2024.10",
    "pyjwt[crypto]>=2.10",
    # Imported directly, not only through pyjwt's extra: X.509 for the node's own
    # certificate (N17) and Fernet for upstream credentials at rest (N10). A transitive
    # dependency that pyjwt could drop is the wrong thing for the node's key handling
    # to rest on.
    "cryptography>=44",
    "httpx>=0.28",
]

[project.scripts]
circuless-node = "circuless_node.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx2>=2.13.1",
    # Reading deploy/docker-compose.yml in the structural tests, to assert the node
    # publishes no host port and shares the agent's namespace (N15). Not a runtime
    # dependency: the node never parses YAML.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuless_node"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in an argument default is how FastAPI declares a dependency. B008 is aimed at
# mutable defaults evaluated once at import, which this is not.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
